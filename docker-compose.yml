
services:
  backend:
    build:
      context: ./drogon
      dockerfile: Dockerfile
    ports:
      - "5150:5150"
    volumes:
      - ./drogon/config.json:/app/config.json
      - ./dist:/app/dist
    restart: unless-stopped
    environment:
      - TZ=UTC
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bankara_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
